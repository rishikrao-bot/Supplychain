<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your Company · Live portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500&display=swap">
<style>
  :root{--teal:#25C4A9;--ink:#1E3440;--muted:#587078;--mist:#F1F7F6;--line:#D5E2E1;--card:#FFFFFF}
  @media (prefers-color-scheme: dark){:root{--ink:#E4EEEE;--muted:#93AAB0;--mist:#0E181D;--line:#2A3E47;--card:#15232A}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--mist);color:var(--ink);font:16px/1.6 "Inter",system-ui,sans-serif;display:flex;flex-direction:column}
  header{background:#FFFFFF;border-bottom:3px solid var(--teal);padding:14px 20px}
  header img{height:46px;display:block}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .card{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:10px;max-width:460px;width:100%;padding:32px;display:flex;flex-direction:column;gap:14px}
  .tag{align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border-radius:4px;padding:3px 9px;background:var(--teal);color:#14303A}
  h1{font-family:"Montserrat",system-ui,sans-serif;font-size:24px;margin:0}
  p{margin:0;color:var(--muted)}
  a{color:inherit}
</style>
</head>
<body>
<header><a href="../"><img src="../assets/logo.svg" alt="Your Company: back to start"></a></header>
<main>
  <div class="card">
    <span class="tag">Live system</span>
    <h1>The live portal is being set up</h1>
    <p>Logins will open here once accounts are created. You'll receive an email invite from Your Company to set up your password and two-step verification.</p>
    <p><a href="../demo/">See the demo in the meantime</a> · <a href="../">Back</a></p>
  </div>
</main>
</body>
</html>
