<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
.demo-banner{background:#B86A00;color:#FFFFFF;font:600 13px/1.4 system-ui,sans-serif;padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.demo-banner b{letter-spacing:.14em}
.demo-banner a{color:#FFFFFF}
</style>
</head>
<body>
<div class="demo-banner" role="note"><span><b>DEMO</b> · Sample data only. Nothing here is real, and nothing you enter reaches the live system.</span><a href="../">Leave the demo</a></div>
<title>DEMO · Reactive Maintenance Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: brand band header with role switch; left nav + work area; engineer view is a phone-width column. */
:root{
  --bg:#F1F7F6; --surface:#FFFFFF; --surface-2:#E9F1F0; --line:#D5E2E1;
  --fg:#1E3440; --muted:#587078; --brand:#294653; --band:#FFFFFF; --band-fg:#294653; --deep:#294653;
  --accent:#25C4A9; --accent-ink:#13806D; --accent-soft:#DDF4EF; --accent-fg:#14303A;
  --ok:#23784A; --ok-soft:#DDF1E5; --warn:#9A6212; --warn-soft:#FBEFD9; --crit:#B23A2E; --crit-soft:#F9E1DE;
  --info:#3A5A8C; --info-soft:#E1E9F5;
  --f-display:"Montserrat",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --c-cost:#2a78d6; --c-margin:#1baf7a; --violet:#6B4FBB; --violet-soft:#EEE9FA;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E181D; --surface:#15232A; --surface-2:#1B2C34; --line:#2A3E47;
  --fg:#E4EEEE; --muted:#93AAB0; --brand:#B5CDD6; --band:#FFFFFF; --band-fg:#294653; --deep:#1B323C;
  --accent:#25C4A9; --accent-ink:#43D8BE; --accent-soft:#123A35; --accent-fg:#0E181D;
  --ok:#5CC48A; --ok-soft:#14301F; --warn:#E3A84B; --warn-soft:#33270F; --crit:#F0806F; --crit-soft:#3A1A16;
  --info:#8FB0E3; --info-soft:#1B2840; --c-cost:#3987e5; --c-margin:#199e70; --violet:#B9A4F2; --violet-soft:#2A2340; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E181D; --surface:#15232A; --surface-2:#1B2C34; --line:#2A3E47;
  --fg:#E4EEEE; --muted:#93AAB0; --brand:#B5CDD6; --band:#FFFFFF; --band-fg:#294653; --deep:#1B323C;
  --accent:#25C4A9; --accent-ink:#43D8BE; --accent-soft:#123A35; --accent-fg:#0E181D;
  --ok:#5CC48A; --ok-soft:#14301F; --warn:#E3A84B; --warn-soft:#33270F; --crit:#F0806F; --crit-soft:#3A1A16;
  --info:#8FB0E3; --info-soft:#1B2840; --c-cost:#3987e5; --c-margin:#199e70; --violet:#B9A4F2; --violet-soft:#2A2340; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;color:var(--fg)}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-fg);border-bottom:3px solid var(--accent);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:46px;width:auto;flex:none;display:block}
@media (max-width:640px){.roles{margin-left:0;width:100%;border-radius:10px;flex-wrap:nowrap}.roles button{flex:1;padding:6px 4px;font-size:12px;border-radius:8px}}
.brand span{font-size:12px;color:#587078;border-left:1px solid #D5E2E1;padding-left:10px;line-height:1.3}
.roles{margin-left:auto;display:flex;background:#E9F1F0;border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.roles button{border:0;background:transparent;color:#294653;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.roles button[aria-pressed="true"]{background:#294653;color:#FFFFFF;font-weight:600}
.demo-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #25C4A9;color:#13806D;border-radius:4px;padding:2px 6px}

/* Shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 56px)}
.nav{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:var(--hdr,76px);align-self:start;height:calc(100vh - var(--hdr,76px));overflow-y:auto;z-index:15}
.nav .who{padding:4px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--fg)}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav .count{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:1px 7px}
.nav .count.hot{background:var(--crit-soft);color:var(--crit)}
.nav .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line)}
main{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin-top:4px;max-width:70ch}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));height:auto}
  .nav .who,.nav .foot{display:none}
  .nav button{white-space:nowrap}
}

/* Panels & grids */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.split{grid-template-columns:1fr}}
@media (max-width:560px){.g2,.g4{grid-template-columns:1fr}}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat.crit .v{color:var(--crit)} .stat.warn .v{color:var(--warn)}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.val td{padding:7px 0;border-bottom:1px dashed var(--line)}
.val td.calc{color:var(--muted);font-size:12.5px;padding-left:12px}
.val tr.total td{border-top:2px solid var(--fg);border-bottom:0;font-weight:600;padding-top:10px}
.val tr.zero td{color:var(--muted)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pri{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pri.Emergency{border-color:var(--crit);color:var(--crit)} .pri.Urgent{border-color:var(--warn);color:var(--warn)}
.tag{font-size:11px;border:1px dashed var(--warn);color:var(--warn);border-radius:4px;padding:1px 6px;white-space:nowrap}

/* Buttons & forms */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:8px 10px}
textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--surface)}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.check.on{border-color:var(--accent);background:var(--accent-soft)}

/* Callouts & alerts */
.note{border-left:3px solid var(--info);background:var(--info-soft);padding:10px 12px;border-radius:0 6px 6px 0}
.note.warn{border-color:var(--warn);background:var(--warn-soft)} .note.crit{border-color:var(--crit);background:var(--crit-soft)} .note.ok{border-color:var(--ok);background:var(--ok-soft)}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.alert .bar{background:var(--warn)} .alert.crit .bar{background:var(--crit)} .alert.closed .bar{background:var(--ok)}
.alert .in{padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}

/* Photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photo{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface-2)}
.photo img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.photo figcaption{font-size:11.5px;padding:5px 8px;color:var(--muted)}

/* Timeline */
td select{min-width:150px;width:auto}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.tl li:last-child{border-bottom:0}
.tl time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

/* Flow steps */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.steps span.done{background:var(--ok-soft);color:var(--ok)} .steps span.now{background:var(--accent);color:var(--accent-fg)}

/* Engineer phone */
.phone{max-width:420px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:640px;display:flex;flex-direction:column}
.phone-h{background:var(--deep);color:#FFFFFF;border-bottom:3px solid var(--accent);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.phone-h h2{color:#FFFFFF;font-size:16px}
.phone-b{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.jobcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.jobcard:hover{border-color:var(--accent)}
.sig{width:100%;height:140px;border:1px dashed var(--muted);border-radius:6px;background:var(--surface-2);touch-action:none;display:block}
.signed{font-family:"Brush Script MT","Segoe Script",cursive;font-size:24px;color:var(--brand)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
fieldset{border:1px solid var(--line);border-radius:6px;padding:8px 10px 10px;margin:0;min-width:0}
legend{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 4px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 7px;font-size:12.5px;cursor:pointer;background:var(--surface)}
.opt input{accent-color:var(--accent);margin:0}
.opt:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.ctag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface-2)}
.ctag.bad{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
.ctag.cert{border-color:var(--ok)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.15);max-width:240px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .val{fill:var(--fg);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.mbar{height:6px;border-radius:3px;background:var(--c-margin);display:inline-block;vertical-align:middle;margin-right:8px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.tipi{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font:600 10px/1 var(--f-body);cursor:help;margin-left:6px;vertical-align:1px;text-transform:none;letter-spacing:0}
.tipi:hover,.tipi:focus-visible{border-color:var(--accent-ink);color:var(--accent-ink)}
tr[class*="st-"] td:first-child{box-shadow:inset 5px 0 0 var(--stc,transparent)}
tr.st-awaiting{--stc:var(--warn)} tr.st-awaiting td{background:var(--warn-soft)}
tr.st-approved,tr.st-offered,tr.st-slots{--stc:var(--info)}
tr.st-dispatched,tr.st-onsite{--stc:var(--accent)}
tr.st-review{--stc:var(--violet)} tr.st-review td{background:var(--violet-soft)}
tr.st-hold{--stc:var(--crit)} tr.st-hold td{background:var(--crit-soft)}
tr.st-complete{--stc:var(--ok)}
tr.st-cancelled{--stc:var(--line)} tr.st-cancelled td{color:var(--muted)}
tr.click:hover td{filter:brightness(.97)}
.key{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:12px;height:12px;border-radius:2px;display:inline-block}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;color:var(--muted)}
.crumbs a,.crumbs span.c{font-family:var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:var(--surface);color:var(--fg);text-decoration:none}
.crumbs a:hover{border-color:var(--accent-ink)}
.crumbs .cur{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.crumbs .sep{color:var(--muted)}
.att{display:flex;gap:8px;flex-wrap:wrap}
.att .f{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px;background:var(--surface);max-width:100%}
.att .f img{width:34px;height:34px;object-fit:cover;border-radius:3px}
.att .f span{overflow-wrap:anywhere}
.xrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) 90px auto;gap:8px;align-items:end}
@media (max-width:640px){.xrow{grid-template-columns:1fr 1fr}}
.bench{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.slot{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px;flex-wrap:wrap}
.slot.pref{border-color:var(--accent);background:var(--accent-soft)}
.tile{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--surface);position:relative}
.tile:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(20,48,58,.08)}
.tile:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.tile .go{order:9;font-size:12px;font-weight:500;color:var(--accent-ink);margin-top:2px}
.tile:hover .go{color:var(--accent-ink)}
.rv{position:fixed;inset:0;z-index:70;background:rgba(10,20,26,.72);display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.rv-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);padding:10px 14px;border-radius:8px 8px 0 0;max-width:860px;width:100%;margin:0 auto}
.rv-pages{overflow:auto;background:var(--surface-2);max-width:860px;width:100%;margin:0 auto;flex:1;padding:14px;display:flex;flex-direction:column;gap:14px;align-items:center;border-radius:0 0 8px 8px}
.rv-pages img{width:100%;max-width:800px;box-shadow:0 2px 10px rgba(0,0,0,.25);background:#fff}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;max-width:calc(100% - 32px);font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.hide-sm{} @media (max-width:640px){.hide-sm{display:none}}
@media (prefers-reduced-motion:no-preference){.btn,.nav button,.jobcard{transition:background .15s,border-color .15s}}
</style>

function minHours(band){ return band === 'normal' ? 1 : 2; }
function chargeHours(h, band){ const m = minHours(band); return h <= m ? m : Math.ceil(h * 2) / 2; }

/* Client Co valuation. mode: 'estimate' uses est.*, 'actual' uses the visit record. */
function valuation(j, mode='estimate'){
  const st = S.settings, s = site(j.site) || {}, L = [];
  const add = (label, calc, amount, opts={}) => L.push({label, calc, amount:r2(amount), ...opts});
  if (j.trade === 'service'){
    const sp = j.specialist || {}; const cost = (mode === 'actual' && sp.actualCost) || sp.cost || 0;
    add(`Specialist: ${j.svcCat || 'supply chain'}`, `Specialist quotation${sp.ref ? ' ' + sp.ref : ''}, at cost`, cost);
    const fee = Math.max(cost * st.specialistFee / 100, st.specialistMin);
    add('Management fee', `${st.specialistFee}% of cost${fee === st.specialistMin ? ` (minimum ${gbp(st.specialistMin)} applies)` : ''}`, fee);
    return finish(L);
  }
  const visit = j.visit || {};
  const noAccess = mode === 'actual' && visit.outcome === 'noaccess';
  // Call-out
  if (j.parent && !st.returnVisitCallout) add('Call-out', `Not charged: return visit from ${j.parent}, booked as planned works`, 0, {zero:true});
  else if (j.priority === 'Emergency') add('Call-out: emergency', 'Within 12 hours', CALLOUT.Emergency);
  else add('Call-out: standard', `${j.priority} attendance`, CALLOUT.standard);
  // Zone
  if (s.zone === 'B') add('Zone B supplement', 'Travel beyond Zone A, up to 90 minutes each way', ZONE_B);
  if (s.zone === 'C') add('Travel', 'Zone C: quoted per job', 0, {zero:true});
  // Labour
  const R = RATES[j.trade], rate = R[j.band];
  const raw = mode === 'actual' ? (visit.hours || 0) : (j.est?.hours || 0);
  const h = chargeHours(raw, j.band);
  if (rate == null) add(`Labour: ${R.label}`, `${BANDS[j.band]} rate TBC in schedule`, 0, {zero:true});
  else add(`Labour: ${R.short}`, `${h} h × ${gbp(rate)} (${BANDS[j.band].toLowerCase()})${raw < h ? ` · min/30-min rounding from ${hrs(raw)}` : ''}`, h * rate);
  // Assisting trade (e.g. electrician isolating for lift engineer)
  if (!noAccess) [...(j.assist ? [{ ...j.assist, assist:true }] : []), ...(j.extra || [])].forEach(x => {
    const AR = RATES[x.trade], ar = AR[j.band], ah = chargeHours(x.hours || 0, j.band), nm = x.comp || AR.short;
    if (st.multiTrade === 'per_trade') add(`Call-out: ${nm}`, 'Additional trade attending (call-out per trade)', j.priority === 'Emergency' ? CALLOUT.Emergency : CALLOUT.standard);
    else add(`Call-out: ${nm}`, 'Not charged: one call-out per visit (setting)', 0, {zero:true});
    if (ar == null) add(`Labour: ${nm}`, `${BANDS[j.band]} rate TBC in schedule`, 0, {zero:true});
    else add(`Labour: ${nm}${x.assist ? ' (assist)' : ''}`, `${ah} h × ${gbp(ar)} (${AR.short.toLowerCase()})`, ah * ar);
  });
  // Materials
  const mat = mode === 'actual' ? (visit.materials || []).reduce((a, m) => a + Number(m.cost || 0), 0) : (j.est?.materials || 0);
  if (mat > 0) add('Materials', `${gbp(mat)} cost + ${st.materialsMarkup}%`, mat * (1 + st.materialsMarkup / 100));
  if (mode === 'actual' && visit.expenses > 0) add('Parking / congestion / ULEZ', 'Recharged at cost', visit.expenses);
  return finish(L);
}
function finish(L){ return { lines:L, total:r2(L.reduce((a, l) => a + l.amount, 0)) }; }

/* What Example Services pays the contractor (self-bill). Returns null for direct labour. */
function contractorCost(j){
  const c = contractor(j.contractor || j.specialist?.contractor); if (!c || c.type === 'dlo') return null;
  const st = S.settings, v = j.visit || {};
  let labour = 0, materials = 0; const L = [];
  if (j.trade === 'service'){
    const cost = j.specialist.actualCost || j.specialist.cost;
    labour = cost * (j.specialist.labourPct || 0); materials = cost - labour;
    L.push(['Agreed quotation ' + (j.specialist.ref || ''), cost]);
  } else {
    const co = (j.parent && !st.returnVisitCallout) ? 0 : c.rates.callout;
    const h = chargeHours(v.hours || 0, j.band), rate = c.rates[j.band] || c.rates.normal;
    labour = co + h * rate;
    materials = (v.materials || []).reduce((a, m) => a + Number(m.cost || 0), 0) + (v.expenses || 0);
    L.push([`Call-out (contractor rate)`, co], [`Labour ${h} h × ${gbp(rate)}`, h * rate], ['Materials & expenses at cost', materials]);
  }
  const gross = labour + materials, cis = SHOW_CIS ? labour * CIS_RATE[c.cis] : 0;
  return { c, lines:L, labour:r2(labour), materials:r2(materials), gross:r2(gross), cis:r2(cis), net:r2(gross - cis) };
}
function needsApproval(j){
  const p = S.settings.approvalPolicy;
  if (p === 'all') return true;

/* ============================== Photos ============================== */
const photoCache = {};
function samplePhoto(p){
  const key = p.label + p.ts + p.kind; if (photoCache[key]) return photoCache[key];
  const c = document.createElement('canvas'); c.width = 480; c.height = 320; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 480, 320); g.addColorStop(0, `hsl(${p.hue},18%,38%)`); g.addColorStop(1, `hsl(${p.hue + 20},14%,22%)`);
  x.fillStyle = g; x.fillRect(0, 0, 480, 320);
  x.strokeStyle = 'rgba(255,255,255,.18)'; x.lineWidth = 14;
  if (p.kind === 'noaccess'){ x.fillStyle = 'rgba(255,255,255,.12)'; x.fillRect(150, 50, 180, 240); x.fillStyle='rgba(255,255,255,.35)'; x.fillRect(300, 170, 14, 30); }
  else { x.beginPath(); x.moveTo(0, 110); x.lineTo(300, 110); x.lineTo(300, 320); x.stroke(); x.beginPath(); x.moveTo(480, 200); x.lineTo(360, 200); x.stroke();
    x.fillStyle = p.kind === 'before' ? 'rgba(255,190,120,.35)' : 'rgba(140,230,180,.30)'; x.beginPath(); x.arc(300, 110, 30, 0, 7); x.fill(); }
  x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, 282, 480, 38);
  x.fillStyle = '#fff'; x.font = '600 13px system-ui'; x.fillText(new Date(p.ts).toLocaleString('en-GB') + '  ·  GPS ' + p.gps, 12, 306);
  x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(10, 10, 12 + x.measureText(p.kind.toUpperCase()).width + 8, 26);
  x.fillStyle = '#fff'; x.font = '700 12px system-ui'; x.fillText(p.kind === 'noaccess' ? 'NO ACCESS' : p.kind.toUpperCase(), 18, 28);
  return photoCache[key] = c.toDataURL('image/jpeg', .8);
}
const photoSrc = p => p.src || samplePhoto(p);
const photoGrid = (arr, title) => arr?.length ? `<div class="field"><span class="eyebrow">${title}</span><div class="photos">${arr.map(p => `<figure class="photo" style="margin:0"><img src="${photoSrc(p)}" alt="${esc(p.label)}"><figcaption>${esc(p.label)} · ${fmtT(p.ts)}</figcaption></figure>`).join('')}</div></div>` : '';
function stampPhoto(file, label, kind, gps, cb){
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
    const sc = Math.min(1, 800 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * sc; c.height = im.height * sc;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height); const ts = nowISO();
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, c.height - 34, c.width, 34); x.fillStyle = '#fff'; x.font = '600 13px system-ui';
    x.fillText(new Date(ts).toLocaleString('en-GB') + '  ·  GPS ' + gps, 10, c.height - 12);
    cb({ src:c.toDataURL('image/jpeg', .7), label, ts, gps, kind });
  }; im.src = rd.result; };
  rd.readAsDataURL(file);
}

function trail(j){

function attHtml(list){ return (list || []).map((f, i) => `<span class="f">${f.thumb ? `<img src="${f.thumb}" alt="">` : '<span class="mono small">' + esc((f.name.split('.').pop() || 'file').toUpperCase()) + '</span>'}<span>${esc(f.name)}<br><span class="muted">${Math.max(1, Math.round(f.size / 1024))} KB</span></span>${f.rm ? `<button type="button" class="btn sm" data-rmatt="${i}" aria-label="Remove ${esc(f.name)}">×</button>` : ''}</span>`).join(''); }
function readFiles(files, cb){
  const out = []; let left = files.length; if (!left) return cb(out);
  [...files].forEach(f => { const rec = { name:f.name, size:f.size, type:f.type };
    if (!f.type.startsWith('image/')){ out.push(rec); if (!--left) cb(out); return; }
    const rd = new FileReader(); rd.onload = () => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'), sc = 160 / Math.max(im.width, im.height); c.width = im.width * sc; c.height = im.height * sc; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); rec.thumb = c.toDataURL('image/jpeg', .7); out.push(rec); if (!--left) cb(out); }; im.onerror = () => { out.push(rec); if (!--left) cb(out); }; im.src = rd.result; }; rd.readAsDataURL(f); });
}
function submitOrder(clientco){
  const j = readOrder(), id = 'JOB-' + S.seq.job++;
  j.attachments = (ui.orderFiles || []).map(f => ({ name:f.name, size:f.size, type:f.type, thumb:f.thumb }));
  ui.orderFiles = [];
  Object.assign(j, { id, source: clientco ? 'Client Co portal' : document.getElementById('o-source').value, received: nowISO(), approved:null, contractor:null, engineer:null, log:[] });
  log(j, clientco ? 'Client Co' : 'Helpdesk', clientco ? 'Order raised by Pat Morgan in the Client Co portal.' : `Order logged from ${j.source.toLowerCase()}.`);
  if (clientco && document.getElementById('o-approve').checked){
    const po = document.getElementById('o-po').value || 'PO-' + (771470 + S.seq.job);
    j.approved = { by:'Pat Morgan (Client Co)', at:nowISO(), po, amount:valuation(j).total }; j.status = 'approved'; log(j, 'Client Co', `Estimate approved. ${po}.`);
  } else if (!needsApproval(j)){
    j.status = 'approved'; log(j, 'System', 'Approval not needed before dispatch under current rule. Estimate sent to Client Co.');
  } else { j.status = 'awaiting'; log(j, 'System', 'Estimate sent to Client Co for approval (portal + email).'); }
  S.jobs.unshift(j); save();
  toast(`${id} logged. ${j.status === 'awaiting' ? 'Estimate sent to Client Co.' : 'Ready to dispatch.'}`);
  go(clientco ? 'w-jobs' : 'job', clientco ? null : id);
}

/* ============================== Supply chain offers ============================== */
function forClient(t){
  S.contractors.forEach(c => { if (c.type !== 'dlo') [c.name, c.name.replace(/ Ltd$/, ''), c.name.replace(/^.* t\/a /, '')].forEach(n => { t = t.split(n).join('Example Services supply chain'); }); c.engineers.forEach(e => { t = t.split(e.name).join('engineer'); }); });
  return t.replace(/Offered to Example Services supply chain[^.]*\.( Respond by [^.]*\.)?/, 'Booking engineer.').replace(/Emergency offered to \d+ eligible partners? at once\./, 'Booking engineer.');
}
const SCORE_PARTS = ['Report', 'Timekeeping', 'Success', 'No repeat visit', 'Time on site'];
function partnerScore(c){
  if (c.type === 'dlo') return null;
  const jobs = finJobs().filter(r => r.partner === c.id && r.date >= '2026-08-18').length;
  if (!c.stats || !jobs) return { score:100, parts:SCORE_PARTS.map(n => [n, null]), band:['New','info'], isNew:true, jobs:0, earned:0, possible:0 };
  const earnedBy = c.stats.map(p => Math.round(p / 100 * jobs)), earned = earnedBy.reduce((a, b) => a + b, 0), possible = jobs * 5, score = Math.round(earned / possible * 100);
  return { score, parts:SCORE_PARTS.map((n, i) => [n, earnedBy[i] + '/' + jobs]), band: score >= 80 ? ['Good','ok'] : score >= 60 ? ['OK','warn'] : ['Poor','crit'], isNew:false, jobs, earned, possible };
}
function partnerEligibility(j){
  const s = site(j.site), val = valuation(j).total, offers = j.offers || [];
  return S.contractors.filter(c => c.type !== 'dlo').map(c => {
    const st = contractorState(c), prev = offers.find(o => o.contractor === c.id);
    const tradeOk = j.comp ? (c.comps || []).includes(j.comp) : j.trade === 'service' ? c.type === 'spec' && (c.cats || []).includes(j.svcCat) : c.trades.includes(j.trade);
    let why = '';
    if (!tradeOk) why = j.comp ? `No ${j.comp} competency` : j.trade === 'service' ? `Doesn't cover ${j.svcCat.toLowerCase()}` : `Doesn't cover ${RATES[j.trade].short.toLowerCase()}`;
    else if (j.comp && !certOk(c, j.comp).ok) why = `${S.certReq[j.comp]} certificate missing or expired`;
    else if (!c.zones.includes(s.zone)) why = `Doesn't cover Zone ${s.zone}`;
    else if (c.suspended) why = 'Suspended by Example Services';
    else if (st.blocked.length) why = `Blocked: ${st.blocked[0].item} expired`;
    else if (c.maxValue && val > c.maxValue) why = `Over their job limit of ${gbp(c.maxValue)}`;
    else if (prev) why = prev.status === 'declined' ? 'Declined this job' : prev.status === 'expired' ? 'Missed the deadline' : prev.status === 'offered' ? 'Offer live' : 'Already offered';
    const open = S.jobs.filter(x => x.contractor === c.id && ['dispatched','onsite'].includes(x.status)).length;
    return { c, ok:!why, why, open, sc:partnerScore(c).score };
  }).sort((a, b) => (b.ok - a.ok) || b.sc - a.sc || a.open - b.open);
}
function offerJob(j){
  const ok = partnerEligibility(j).filter(x => x.ok); if (!ok.length) return false;
  const broadcast = j.priority === 'Emergency', st = S.settings;
  const deadline = new Date(Date.now() + (broadcast ? st.offerMinsEmergency * 6e4 : st.offerHours * 36e5)).toISOString();
  const targets = broadcast ? ok : [ok[0]];
  (j.offers ||= []).push(...targets.map(x => ({ contractor:x.c.id, at:nowISO(), deadline, status:'offered', mode:broadcast ? 'broadcast' : 'single' })));
  j.status = 'offered';
  log(j, 'Helpdesk', broadcast ? `Emergency offered to ${targets.length} eligible partner${targets.length === 1 ? '' : 's'} at once.` : `Offered to ${targets[0].c.name}. Respond by ${fmtDT(deadline)}.`);
  return true;
}
function nextOffer(j){
  if ((j.offers || []).some(o => o.status === 'offered')) return;
  if (!offerJob(j)){ j.status = 'approved'; log(j, 'System', 'No eligible partner left. Back with the helpdesk to assign.'); }
}
function acceptOffer(j, cid, eng){
  j.offers.forEach(o => { if (o.status === 'offered') o.status = o.contractor === cid ? 'accepted' : 'withdrawn'; });
  j.contractor = cid; j.engineer = eng; j.status = 'dispatched';
  if (j.trade === 'service'){ j.specialist ||= {}; j.specialist.contractor = cid; }
  log(j, contractor(cid).name, `Accepted the job. ${eng} will attend${j.window ? ', ' + j.window : ''}.`);
}
function declineOffer(j, cid, reason){
  const o = j.offers.find(o => o.contractor === cid && o.status === 'offered'); o.status = 'declined'; o.reason = reason;
  log(j, contractor(cid).name, `Declined the job: ${reason.toLowerCase()}.`);
  nextOffer(j);
}
const OFFER = { offered:['Waiting for reply','warn'], accepted:['Accepted','ok'], declined:['Declined','crit'], expired:['Missed deadline','crit'], withdrawn:['Withdrawn','info'] };
function dispatchPanel(j, wait){

  const offers = j.offers || [], live = offers.some(o => o.status === 'offered'), lock = wait ? 'disabled' : '';
  const broadcast = j.priority === 'Emergency', st = S.settings;
  const dloEng = j.trade === 'service' ? [] : contractor('K1').engineers.filter(e => e.trade === j.trade);
  let h = `<div class="panel"><div class="panel-h"><h2>Dispatch</h2>${wait ? '<span class="chip warn">Locked until Client Co approves</span>' : live ? '<span class="chip acc">Offer out</span>' : ''}</div><div class="panel-b">`;
  if (wait) h += `<p class="small muted">Rule: ${esc(policyText())}. Change it under Rules &amp; settings.</p>`;
  h += `<div class="field"><label for="window">Appointment window</label><input type="text" id="window" value="${esc(j.window || '')}" placeholder="e.g. 20 Nov, 08:00–10:00" ${lock}></div>`;
  if (offers.length) h += `<div><span class="eyebrow">Offers so far</span><ul class="tl">${offers.map((o, i) => `<li><time>${fmtDT(o.at)}</time><div><b>${esc(contractor(o.contractor).name)}</b> <span class="chip ${OFFER[o.status][1]}">${OFFER[o.status][0]}</span>${o.reason ? `<div class="small muted">${esc(o.reason)}</div>` : ''}${o.status === 'offered' ? `<div class="row small muted">Reply by ${fmtDT(o.deadline)} <button class="btn sm" data-expire="${i}">Deadline passed (demo)</button></div>` : ''}</div></li>`).join('')}</ul></div>`;

  if (!live){
    if (ok.length && !broadcast) h += `<div class="bench small"><b>Request availability${info('Sends the job to every eligible partner at once. Each replies with up to 3 booking slots. You choose which to book, and Client Co sees the slots (without partner names) and can mark a preference.')}</b><span class="muted">Ask all ${ok.length} eligible partner${ok.length > 1 ? 's' : ''} for booking slots, then choose.</span><button class="btn sm primary" data-act="reqSlots" ${lock} style="align-self:flex-start">Request availability from ${ok.length}</button></div>`;

    if (ok.length) h += `<p class="small muted">${broadcast ? `Emergency: offered to all ${ok.length} eligible partner${ok.length > 1 ? 's' : ''} at once. First to accept gets the job. Reply within ${st.offerMinsEmergency} minutes.` : `Offered to one partner at a time, in this order. If they decline or miss the ${st.offerHours}-hour deadline, it moves to the next.`}</p>
      <ol class="small" style="margin:0;padding-left:18px">${ok.map(x => `<li>${esc(x.c.name)} <span class="muted">· score ${x.sc} · ${x.open} live job${x.open === 1 ? '' : 's'}</span></li>`).join('')}</ol>

}

function allSlots(j){ return Object.entries(j.slots?.replies || {}).flatMap(([cid, r]) => (r.slots || []).map((sl, i) => ({ cid, i, sl, key:cid + '|' + i }))).sort((a, b) => (a.sl.date + a.sl.win).localeCompare(b.sl.date + b.sl.win)); }

/* ============================== Profitability ============================== */
function segs(recs, key, label){
  const g = {}; recs.forEach(r => { const k = key(r); if (k == null) return; const x = g[k] ||= { n:0, rev:0, cost:0 }; x.n++; x.rev += r.revenue; x.cost += r.cost; });
  return Object.entries(g).map(([k, x]) => ({ k, label:label(k), ...x, m:x.rev - x.cost, pct:x.rev ? (x.rev - x.cost) / x.rev * 100 : 0 })).sort((a, b) => b.m - a.m);
}
const verdict = p => p >= 30 ? ['Working','ok'] : p >= 15 ? ['Watch','warn'] : ['Not working','crit'];
const pct = n => `${Math.round(n)}%`;
const gbp0 = n => (n < 0 ? '−' : '') + '£' + Math.round(Math.abs(n)).toLocaleString('en-GB');
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v || 1))), m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
function profitChart(recs){
  const mo = {}; recs.forEach(r => { const k = r.date.slice(0, 7), x = mo[k] ||= { rev:0, cost:0, n:0 }; x.rev += r.revenue; x.cost += r.cost; x.n++; });
  const keys = Object.keys(mo).sort(); if (!keys.length) return '<div class="empty">No valued jobs in this period.</div>';
  const W = 640, H = 250, L = 52, Rr = 10, T = 30, B = 26, top = niceMax(Math.max(...keys.map(k => mo[k].rev)) * 1.08);
  const y = v => T + (H - T - B) * (1 - v / top), step = (W - L - Rr) / keys.length, bw = Math.min(56, step * .46);
  const ticks = [0, .25, .5, .75, 1].map(f => f * top);
  const topR = (x, yy, w, h, r) => h <= 0 ? '' : `M${x},${yy + h}V${yy + Math.min(r, h)}Q${x},${yy} ${x + Math.min(r, w / 2)},${yy}H${x + w - Math.min(r, w / 2)}Q${x + w},${yy} ${x + w},${yy + Math.min(r, h)}V${yy + h}Z`;
  const nm = k => new Date(k + '-15').toLocaleDateString('en-GB', { month:'short' }) + (k === '2026-11' ? ' (to date)' : '');
  return `<div class="legend"><span><i style="background:var(--c-cost)"></i>Direct cost</span><span><i style="background:var(--c-margin)"></i>Gross margin</span><span>Bar height = value certified to Client Co</span></div>
  <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly value split into direct cost and gross margin">
  ${ticks.map(t => `<line x1="${L}" x2="${W - Rr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t >= 1000 ? '£' + (t / 1000).toFixed(t % 1000 ? 1 : 0) + 'k' : '£' + t}</text>`).join('')}
  ${keys.map((k, i) => { const x = L + step * i + (step - bw) / 2, m = mo[k], mg = Math.max(0, m.rev - m.cost), yc = y(Math.min(m.cost, m.rev)), yb = y(0), yr = y(m.rev);
    const tip = `<b>${nm(k)}</b><br>${m.n} jobs<br>Value ${gbp0(m.rev)}<br>Cost ${gbp0(m.cost)}<br>Margin ${gbp0(m.rev - m.cost)} (${pct((m.rev - m.cost) / m.rev * 100)})`;
    return `<path d="${mg > 0 ? `M${x},${yc}H${x + bw}V${yb}H${x}Z` : topR(x, yc, bw, yb - yc, 4)}" fill="var(--c-cost)"/>
      ${mg > 0 ? `<path d="${topR(x, yr, bw, Math.max(0, yc - yr - 2), 4)}" fill="var(--c-margin)"/>` : ''}
      <text class="val" x="${x + bw / 2}" y="${yr - 16}" text-anchor="middle">${gbp0(m.rev)}</text><text x="${x + bw / 2}" y="${yr - 4}" text-anchor="middle">${pct((m.rev - m.cost) / m.rev * 100)} margin</text>
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${nm(k)}</text>
      <rect x="${L + step * i}" y="${T - 20}" width="${step}" height="${H - T - B + 20}" fill="transparent" data-tip="${esc(tip)}"/>`; }).join('')}
  </svg></div>
  <details><summary class="small muted" style="cursor:pointer">Show as table</summary><div class="tbl-wrap"><table><thead><tr><th>Month</th><th class="num">Jobs</th><th class="num">Value</th><th class="num">Cost</th><th class="num">Margin</th><th class="num">Margin %</th></tr></thead><tbody>${keys.map(k => { const m = mo[k]; return `<tr><td>${nm(k)}</td><td class="num mono">${m.n}</td><td class="num mono">${gbp(m.rev)}</td><td class="num mono">${gbp(m.cost)}</td><td class="num mono">${gbp(m.rev - m.cost)}</td><td class="num mono">${pct((m.rev - m.cost) / m.rev * 100)}</td></tr>`; }).join('')}</tbody></table></div></details>`;
}
function segTable(rows){
  return `<div class="tbl-wrap"><table><thead><tr><th></th><th class="num">Jobs</th><th class="num">Value</th><th class="num">Cost</th><th class="num">Margin</th><th>Margin %</th><th>Verdict</th></tr></thead><tbody>${rows.map(r => { const v = verdict(r.pct); return `<tr><td>${esc(r.label)}</td><td class="num mono">${r.n}</td><td class="num mono">${gbp0(r.rev)}</td><td class="num mono">${gbp0(r.cost)}</td><td class="num mono">${gbp0(r.m)}</td><td style="white-space:nowrap"><span class="mbar" style="width:${Math.max(2, Math.min(60, r.pct) * 1.2)}px"></span><span class="mono">${pct(r.pct)}</span></td><td><span class="chip ${v[1]}">${v[0]}</span></td></tr>`; }).join('')}</tbody></table></div>`;
}
function insights(recs){
  const out = [], comp = segs(recs, r => r.comp, k => k).filter(x => x.n >= 3), part = segs(recs, r => r.partner, k => contractor(k)?.name || k).filter(x => x.n >= 3);
  const all = [...comp.map(x => ({ ...x, dim:'comp' })), ...part.filter(p => !comp.some(c => c.n === p.n && Math.abs(c.rev - p.rev) < .01)).map(x => ({ ...x, dim:'partner' }))].sort((a, b) => a.pct - b.pct);
  const bad = all.filter(x => x.pct < 15).slice(0, 3), good = all.slice().reverse().filter(x => x.pct >= 30).slice(0, 3);
  bad.forEach(x => {
    let why = '';
    const rs = recs.filter(r => x.dim === 'comp' ? r.comp === x.k : r.partner === x.k), main = segs(rs, r => r.partner, k => k)[0], c = main && contractor(main.k);
    if (rs.every(r => r.trade === 'service')) why = `Specialist work only earns the ${S.settings.specialistFee}% management fee. Consider a higher fee or a larger minimum for small instructions.`;
    else if (c && c.rates){ const t = rs[0].trade; why = `${c.name} charges ${gbp(c.rates.normal)}/h plus ${gbp(c.rates.callout)} call-out, against ${gbp(RATES[t].normal)}/h plus £40 from Client Co. Renegotiate the partner's rates, find a second partner, or review the rate with Client Co.`; }
    out.push(['crit', `${x.label}: ${pct(x.pct)} margin on ${x.n} jobs (${gbp0(x.m)}).`, why]);
  });
  good.forEach(x => out.push(['ok', `${x.label}: ${pct(x.pct)} margin on ${x.n} jobs (${gbp0(x.m)}).`, x.dim === 'partner' && x.k === 'K1' ? 'Direct labour is the most profitable route. More capacity here would lift overall margin.' : x.dim === 'partner' ? 'Working well. Offer this partner more work.' : 'Working well at current rates.']));
  const na = recs.filter(r => r.outcome === 'noaccess');
  if (na.length) out.push(['warn', `${na.length} no-access visits recovered ${gbp0(na.reduce((a, r) => a + r.revenue, 0))} against ${gbp0(na.reduce((a, r) => a + r.cost, 0))} cost.`, 'Charges stand when the engineer arrived in the window. Confirming keyholders the day before cuts these.']);
  const held = S.quotes.filter(q => q.status === 'awaiting' && q.fee);
  if (held.length) out.push(['warn', `${gbp0(held.reduce((a, q) => a + q.fee, 0))} of inspection fees held on ${held.length} unconverted quotes.`, `Raise them at the ${S.settings.inspectionReviewMonths}-monthly review if the work isn't ordered.`]);
  const loss = recs.filter(r => r.revenue < r.cost);
  if (loss.length) out.push(['crit', `${loss.length} jobs lost money (${gbp0(loss.reduce((a, r) => a + r.revenue - r.cost, 0))}).`, loss.map(r => r.id).slice(0, 6).join(', ')]);
  return out;
}

function wireEngineer(){
  const app = document.getElementById('app'), E = ui.eng;
  const persistInputs = () => { const g = id => document.getElementById(id); const d = E.d; if (!d) return;
    if (g('wnotes')) d.notes = g('wnotes').value; if (g('wexp')) d.expenses = Number(g('wexp').value) || 0;
    if (g('odet')) d.outcomeDetail = g('odet').value; if (g('oval')) d.furtherValue = Number(g('oval').value) || 0;
    if (g('sname')) d.signedBy = g('sname').value; if (g('demoHrs')) d.demoHours = Number(g('demoHrs').value) || 1;
    if (g('calls')) d.calls = Number(g('calls').value) || 0; if (g('inwin')) d.withinWindow = g('inwin').checked; if (g('nanotes')) d.notes = g('nanotes').value; };
  const rer = () => { render(); };
  app.onclick = e => {
    const t = e.target.closest('button,[data-ejob]'); if (!t) return; persistInputs();
    const ds = t.dataset, j = E.jobId && job(E.jobId);
    if (ds.ejob){ const jj = job(ds.ejob); E.jobId = jj.id; E.d = { arrive:null, gps:null, checklist:{}, before:[], after:[], materials:[], expenses:0, outcome:null, signedBy:'', signature:null };
      E.step = jj.status === 'onsite' ? 'safety' : 'arrive'; if (jj.status === 'onsite' && jj.visitDraft) E.d = jj.visitDraft; return rer(); }
    if (ds.estep){ if (ds.estep === 'list'){ E.step = 'list'; E.jobId = null; } else E.step = ds.estep; return rer(); }
    if (ds.checkin){ const s = site(j.site), [la, lo] = s.gps.split(',').map(Number);
      E.d.arrive = nowISO(); E.d.gps = `${(la + (Math.random() - .5) / 5000).toFixed(4)}, ${(lo + (Math.random() - .5) / 5000).toFixed(4)}`;
      j.status = 'onsite'; log(j, j.engineer, `Checked in on site (GPS ${E.d.gps}, within 50 m of site).`); save(); E.step = 'safety'; return rer(); }
    if (ds.noaccess){ E.step = 'noaccess'; E.d.withinWindow ??= true; return rer(); }
    if (ds.asb){ E.d.outcome = 'asbestos'; E.step = 'outcome'; return rer(); }
    if (ds.sample){ const k = ds.sample, stamp = ds.stamp; E.d[k].push({ ...samplePhotoRef(stamp === 'noaccess' ? 'Locked entrance' : k === 'before' ? 'Before work' : 'After work', nowISO(), E.d.gps || site(j.site).gps, stamp, k === 'before' ? 200 : 150), sample:true }); return rer(); }
    if (ds.addmat){ const desc = document.getElementById('mdesc').value.trim(), cost = Number(document.getElementById('mcost').value); if (!desc || !(cost >= 0)) return toast('Enter an item and its cost.'); E.d.materials.push({ desc, cost }); return rer(); }
    if (ds.rmmat){ E.d.materials.splice(Number(ds.rmmat), 1); return rer(); }
    if (ds.clrsig){ const c = document.getElementById('sig'); c.getContext('2d').clearRect(0, 0, c.width, c.height); c.dataset.inked = ''; return; }
    if (ds.signoff){ const c = document.getElementById('sig'); if (!E.d.signedBy) return toast('Enter the site contact’s name.'); if (c.dataset.inked) E.d.signature = c.toDataURL('image/png'); E.step = 'checkout'; return rer(); }
    if (ds.submitna){ E.d.outcome = 'noaccess'; return submitVisit(j); }
    if (ds.checkout) return submitVisit(j);
  };
  app.onchange = e => { const t = e.target;
    if (t.id === 'engWho'){ E.who = t.value; return rer(); }
    if (t.dataset.chk){ E.d.checklist[t.dataset.chk] = t.checked; return rer(); }
    if (t.name === 'oc'){ persistInputs(); E.d.outcome = t.value; return rer(); }
    if (t.id === 'inwin'){ E.d.withinWindow = t.checked; t.closest('.check').classList.toggle('on', t.checked); }
    if (t.dataset.file && t.files[0]){ const k = t.dataset.file, j = job(E.jobId); persistInputs();
      stampPhoto(t.files[0], k === 'before' ? 'Before work' : 'After work', t.dataset.stamp, E.d.gps || site(j.site).gps, p => { E.d[k].push(p); rer(); }); }
  };
  const c = document.getElementById('sig');
  if (c){ const x = c.getContext('2d'); x.lineWidth = 4; x.lineCap = 'round'; x.strokeStyle = getComputedStyle(document.body).color; let drawing = false;
    const pos = ev => { const r = c.getBoundingClientRect(); return [(ev.clientX - r.left) * c.width / r.width, (ev.clientY - r.top) * c.height / r.height]; };
    c.onpointerdown = ev => { drawing = true; c.setPointerCapture(ev.pointerId); x.beginPath(); x.moveTo(...pos(ev)); };
    c.onpointermove = ev => { if (!drawing) return; x.lineTo(...pos(ev)); x.stroke(); c.dataset.inked = '1'; };
    c.onpointerup = () => drawing = false; }
}
function submitVisit(j){
  const E = ui.eng, d = E.d, depart = new Date(), hours = d.outcome === 'noaccess' ? 0.5 : (d.demoHours || 1.75);
  j.visit = { arrive:d.arrive, depart:depart.toISOString(), hours, gps:d.gps, checklist:d.checklist, before:d.before, after:d.after, notes:d.notes || '', materials:d.materials, expenses:d.expenses || 0,
    outcome:d.outcome || 'complete', outcomeDetail:d.outcomeDetail || '', signedBy:d.signedBy, signature:d.signature, calls:d.calls, withinWindow:d.withinWindow };
  j.status = 'review';
  log(j, j.engineer, `Checked out. Report submitted: ${OUTCOME[j.visit.outcome].toLowerCase()}.`);
  const s = site(j.site), exc = (type, title, detail, charge, ask, actions) => { S.exceptions.unshift({ id:'E-0' + S.seq.exc++, job:j.id, type, at:nowISO(), status:'open', title, detail, charge, ask, actions }); log(j, 'System', `Exception raised: ${title}. Client Co notified by email and portal.`); };
  const v = j.visit;
  if (v.outcome === 'noaccess'){ j.status = 'hold';
    exc('noaccess', `No access at ${s.name}`, `Engineer arrived ${fmtT(v.arrive)}${j.window ? ` (window ${j.window})` : ''}. ${v.calls} call(s) to site contact. ${v.notes}`.trim(),
      v.withinWindow ? 'Minimum charge applies (clause 7): arrival was within the agreed window.' : 'Arrived outside the agreed window: not charged automatically.', 'Rebook the visit, or cancel the order?', ['Rebook visit','Cancel order']); }
  if (v.outcome === 'further'){ const qid = 'Q-' + S.seq.quote++;
    S.quotes.push({ id:qid, site:j.site, desc:v.outcomeDetail || 'Further works', inspected:nowISO(), fee:0, value:d.furtherValue || 800, status:'awaiting', from:`Call-out ${j.id}` });
    exc('further', `Further works found at ${s.name}`, `${v.outcomeDetail || 'Further works required.'} Quoted as ${qid} (${gbp(d.furtherValue || 800)}). No inspection fee: found during a call-out.`, 'Further works need an order before they proceed (clause 16).', `Approve quote ${qid}?`, ['Approve quote','Query quote']); }
  if (v.outcome === 'parts'){ const id = 'JOB-' + S.seq.job++;
    const rv = { id, wRef:j.wRef, parent:j.id, contract:j.contract, site:j.site, priority:'Planned', trade:j.trade, band:'normal', source:'Return visit', received:nowISO(), loc:j.loc, nte:j.nte,
      desc:`Return visit: ${v.outcomeDetail || 'fit parts on order'}.`, est:{ hours:1.5, materials:80 }, approved:null, contractor:null, engineer:null, status:'awaiting', log:[] };
    log(rv, 'System', `Created from ${j.id} (parts required). ${S.settings.returnVisitCallout ? '' : 'No call-out: booked as planned works.'}`);
    if (!needsApproval(rv)) rv.status = 'approved'; S.jobs.unshift(rv);
    exc('parts', `Parts on order: return visit ${id}`, `${(v.outcomeDetail || 'Parts required').replace(/\.?\s*$/, '.')} Return visit ${id} created and sent for approval.`, S.settings.returnVisitCallout ? 'Return visit charged as a new attendance.' : 'No call-out on the return visit.', 'Acknowledge?', ['Acknowledge']); }
  if (v.outcome === 'asbestos'){ j.status = 'hold';
    exc('asbestos', `Suspected asbestos at ${s.name}`, `Work stopped. ${v.outcomeDetail || ''} Area left safe. Asbestos survey required before work continues.`, 'Time on site up to this point is charged (clause 18).', 'Arrange an asbestos survey through the Example Services supply chain?', ['Arrange survey','Client Co to arrange']); }
  const est = j.approved?.amount ?? valuation(j, 'estimate').total, act = valuation(j, 'actual').total;
  if (j.approved && act > est && v.outcome !== 'noaccess') exc('over', `Valuation over approved estimate on ${j.id}`, `Actual ${gbp(act)} against approved ${gbp(est)} (+${gbp(act - est)}). ${v.notes ? 'Engineer notes: ' + v.notes : ''}`, 'Needs Client Co acceptance before invoicing.', 'Accept the revised valuation?', ['Accept','Query']);
  save(); toast(`Report for ${j.id} submitted. Example Services and Client Co notified.`);
  E.step = 'list'; E.jobId = null; E.d = null; render();
}
